program: sources.skill.code.train
method: bayes
project: mw_harl_new
metric:
  goal: maximize
  name: eval_average_episode_rewards.max
parameters:
  algorithm.model.lr:
    min: 0.0001
    max: 0.01
  algorithm.algo.ppo_epoch:
    values: [1, 3, 5, 10, 15]
  algorithm.algo.actor_num_mini_batch:
    values: [1, 4, 8, 32]
  algorithm.train.n_rollout_threads:
    values: [20] 
# n_rollout_threads=20 with n_mini_batch=4
command:
  - ${env}
  - uv
  - "run"
  - "python"
  - "-m"
  - ${program}
  - "run_group=250623_sweep_500"
  - "algorithm=mappo"
  - "env_tweak.max_cycles=500"
  - "environment=raw"
  - "algorithm.train.num_env_steps=50000000"
  - "++env_tweak.terminate_reward=-10.0"
  - ${args_no_hyphens}

# uv run python -m sources.skill.code.train --config-name=train  algorithm=mappo environment=pettingzoo_mw wandb.wandb_group=250708_test model.save_group=0708/1703 ++wandb.wandb_project=mw_harl_new