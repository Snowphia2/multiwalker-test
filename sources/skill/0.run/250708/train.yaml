defaults:
  - default
  - _self_

run_group: 250708_test
save_group: latest
steps:
  - type: train
    multirun: False
    args:
      - algorithm=mappo
      - environment=pettingzoo_mw
      - algorithm_parameters.algo.actor_num_mini_batch=4
      - algorithm_parameters.algo.ppo_epoch=3
      - algorithm_parameters.model.lr=0.008
      - algorithm_parameters.train.n_rollout_threads=20
      - algorithm_parameters.train.num_env_steps=50000000
      - ++environment.env_tweak.max_cycles=1000
      - ++environment.env_tweak.terminate_reward=-10.0
  - type: bark
    args:
      - train_finish
hydra:
  searchpath: 
    - file://sources/skill/0.run